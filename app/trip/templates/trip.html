<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Japan &amp; Bali</title>
  <style>
    :root {
      --paper: #f6efe4;
      --paper-2: #efe5d5;
      --card: #fffaf2;
      --ink: #2b211c;
      --ink-2: #4a3b32;
      --muted: #7a6a5d;
      --line: #e6d9c6;
      --terra: #b5552f;
      --terra-ink: #8f3f20;
      --terra-soft: #f4dccd;
      --flight: #b5552f;
      --stay: #5b6b3a;
      --train: #3f5a73;
      --disney: #7a3f6b;
      --onsen: #2f6b66;
      --ticket: #8a5a2b;
      --other: #6b5a4c;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --script: "Snell Roundhand", "Segoe Script", "Brush Script MT", "Apple Chancery", cursive;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 1px 0 rgba(43, 33, 28, 0.06);
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 var(--sans);
      -webkit-text-size-adjust: 100%;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }
    .wrap {
      width: min(34rem, 100%);
      margin: 0 auto;
      padding: calc(8px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    #app.wrap { width: min(68rem, 100%); }
    .top {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      z-index: 2;
      margin: 0 -16px;
      padding: 10px 16px 10px;
      background: var(--paper);
    }
    #editor .top { position: sticky; top: 0; }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .tools { display: flex; align-items: center; gap: 2px; }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--ink);
    }
    h1 .amp { color: var(--terra); font-style: italic; }
    .lede { margin: 4px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0.02em; }
    .ghost {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 44px;
      padding: 8px 2px;
    }

    /* Day navigation: a sticky strip of circles on a phone, a rail on a wide screen. */
    .layout { display: block; }
    .daynav {
      position: sticky;
      top: 0;
      z-index: 3;
      margin: 0 -16px;
      padding: 8px 12px 10px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 4px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .daynav::-webkit-scrollbar { display: none; }
    .day-btn {
      flex: 0 0 auto;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 52px;
      padding: 2px 2px 0;
      border: 0;
      background: transparent;
      color: var(--ink-2);
      text-align: center;
    }
    .day-btn .circle {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .day-btn .circle svg { width: 19px; height: 19px; display: block; }
    .day-btn .dlabel { font-size: 11px; line-height: 1.15; white-space: nowrap; }
    .day-btn .dlabel b { display: block; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .day-btn .rail-text { display: none; }
    .day-btn[aria-current="true"] .circle { background: var(--terra); border-color: var(--terra); color: #fffaf2; }
    .day-btn[aria-current="true"] .dlabel { color: var(--terra-ink); }
    .day-btn.today .circle::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--terra);
      border: 2px solid var(--paper);
    }
    .day-btn.today[aria-current="true"] .circle::after { background: var(--ink); }
    .day-btn.free .circle { background: transparent; border-style: dashed; }
    .day-btn.free[aria-current="true"] .circle { background: var(--terra); border-color: var(--terra); border-style: solid; color: #fffaf2; }
    .day-btn.overview .circle { border-radius: 14px; }

    @media (min-width: 900px) {
      .layout {
        display: grid;
        grid-template-columns: 15.5rem minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      .daynav {
        position: sticky;
        top: 12px;
        margin: 16px 0 0;
        padding: 6px;
        flex-direction: column;
        gap: 2px;
        max-height: calc(100vh - 24px);
        overflow-x: hidden;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        scroll-snap-type: none;
      }
      .day-btn {
        flex-direction: row;
        gap: 10px;
        min-width: 0;
        width: 100%;
        padding: 6px 8px;
        border-radius: 12px;
        text-align: left;
      }
      .day-btn:hover { background: var(--paper); }
      .day-btn .circle { width: 34px; height: 34px; flex: none; background: var(--paper); }
      .day-btn .circle svg { width: 16px; height: 16px; }
      .day-btn .dlabel { display: none; }
      .day-btn .rail-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
      .day-btn .rail-text strong { font-size: 14px; font-weight: 650; color: var(--ink); white-space: nowrap; }
      .day-btn .rail-text small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .day-btn[aria-current="true"] { background: var(--terra-soft); }
      .day-btn[aria-current="true"] .rail-text strong { color: var(--terra-ink); }
      .day-btn.today .circle::after { border-color: var(--card); }
      .pane { min-width: 0; max-width: 40rem; }
    }

    .hero {
      margin: 6px 0 14px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--paper-2);
      aspect-ratio: 16 / 9;
    }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .day { margin: 22px 0 4px; }
    .day-head { margin: 0 0 12px; }
    .day-kicker {
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--terra-ink);
    }
    .day h2 {
      margin: 2px 0 0;
      font-family: var(--serif);
      font-size: 26px;
      letter-spacing: -0.01em;
      font-weight: 600;
      line-height: 1.15;
    }
    .city {
      display: inline-block;
      margin-left: 0.35em;
      font-family: var(--script);
      font-weight: 400;
      font-size: 1.15em;
      color: var(--terra);
      letter-spacing: 0;
    }
    .day-link {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
    }
    .day-link:hover h2 { color: var(--terra-ink); }
    .day-link .open-day { font-size: 13px; color: var(--muted); font-weight: 600; }
    .one-day .day-head { margin-top: 4px; }
    .free-day {
      margin: 6px 0 0;
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
    }
    .free-day strong { color: var(--ink); font-weight: 650; }
    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 0 6px;
    }
    .pager button {
      flex: 1 1 0;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--ink);
      padding: 6px 12px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .pager button.next { text-align: right; align-items: flex-end; }
    .pager button span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .pager button strong { font-size: 14px; font-weight: 650; }
    .pager button:disabled { visibility: hidden; }

    .timeline {
      --gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .slot {
      display: grid;
      grid-template-columns: 56px 14px minmax(0, 1fr);
      align-items: start;
    }
    .stamp {
      padding: 14px 8px 0 0;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      color: var(--ink-2);
    }
    .stamp-end { color: var(--muted); font-weight: 650; }
    .mark { position: relative; align-self: stretch; min-height: 28px; }
    .mark::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 27px;
      bottom: calc(-1 * var(--gap) - 18px);
      width: 1px;
      background: #d4c3ab;
      transform: translateX(-50%);
    }
    .slot:last-child .mark::before { display: none; }
    .mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 18px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--other);
      box-shadow: 0 0 0 2px var(--paper);
      transform: translateX(-50%);
    }
    .slot.flight .mark::after { background: var(--flight); }
    .slot.stay .mark::after, .slot.note .mark::after { background: var(--stay); }
    .slot.train .mark::after { background: var(--train); }
    .slot.disney .mark::after { background: var(--disney); }
    .slot.onsen .mark::after { background: var(--onsen); }
    .slot.ticket .mark::after { background: var(--ticket); }
    .timeline .card { margin: 0; min-width: 0; }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 12px 14px;
      margin: 0 0 8px;
    }
    .card.has-steps { cursor: pointer; }
    .card.with-photo {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .thumb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      margin-top: 2px;
      background: var(--paper-2);
    }
    .card-body { flex: 1; min-width: 0; }
    .card-main.with-rail {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 8px;
    }
    .rail {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .rail .thumb { margin-top: 0; }
    .icon-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--paper-2);
      color: var(--other);
    }
    .card.flight .pill { background: #f6e0d4; color: var(--flight); }
    .card.stay .pill { background: #e8ead9; color: var(--stay); }
    .card.ticket .pill { background: #f1e4d3; color: var(--ticket); }
    .card.train .pill { background: #e2e8ec; color: var(--train); }
    .card.disney .pill { background: #f0e1ea; color: var(--disney); }
    .card.onsen .pill { background: #dfecea; color: var(--onsen); }
    .filters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .menu { position: relative; }
    .filter-toggle {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      font-size: 15px;
      color: var(--ink);
    }
    .filter-toggle span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filter-toggle svg { flex: none; display: block; }
    .filter-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .filter-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 5;
      max-height: min(70vh, 440px);
      overflow: auto;
      padding: 6px 8px 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(43, 33, 28, 0.14);
    }
    .filter-panel h2 {
      margin: 10px 8px 2px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .filter-panel label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      margin: 0;
      min-height: 44px;
      padding: 0 8px;
      font-size: 16px;
      color: var(--ink);
    }
    .filter-panel .jump {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 0 8px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      text-align: left;
    }
    .filter-panel input {
      width: 22px;
      height: 22px;
      min-height: 22px;
      margin: 0;
      padding: 0;
      flex: none;
      accent-color: var(--terra);
    }
    .empty { margin: 28px 0; color: var(--muted); }
    .todo-card, .total-card, .insure-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .total-card, .insure-card { padding: 14px; }
    .total-sum {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .total-lines {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
    }
    .total-lines li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .total-lines li:first-child { border-top: 0; }
    .total-lines .who { color: var(--muted); }
    .total-note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .insure-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .insure-card h3 { margin: 0; font-size: 17px; font-weight: 650; }
    .insure-card .sub { margin: 4px 0 0; }
    .insure-facts {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
    }
    .insure-facts li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
    }
    .insure-facts li:first-child { border-top: 0; }
    .insure-facts span { color: var(--muted); }
    .insure-facts strong {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }
    .insure-group { margin: 14px 0 0; }
    .insure-group h4 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--terra-ink);
      font-weight: 650;
    }
    .insure-group ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .insure-group li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
    }
    .insure-group a { color: inherit; text-decoration: none; font-weight: 650; }
    .cost { margin: 4px 0 0; font-weight: 650; font-variant-numeric: tabular-nums; }
    .cost .aud { font-weight: 400; color: var(--muted); }
    .todo {
      list-style: none;
      margin: 0;
      padding: 4px 0;
    }
    .todo li {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 14px 4px 10px;
      border-top: 1px solid var(--line);
    }
    .todo li:first-child { border-top: 0; }
    .todo label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      margin: 0;
      min-height: 48px;
      font-size: 16px;
      color: var(--ink);
    }
    .todo input {
      width: 22px;
      height: 22px;
      min-height: 22px;
      margin: 0;
      padding: 0;
      flex: none;
      accent-color: var(--terra);
    }
    .todo .n {
      flex: none;
      width: 1.4em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .todo-delete {
      border: 0;
      background: transparent;
      color: var(--terra-ink);
      font-weight: 650;
      min-height: 44px;
      padding: 0 4px;
    }
    .todo li:not(.picked) .todo-delete { display: none; }
    .todo-add {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px 12px;
      border-top: 1px solid var(--line);
    }
    .todo:empty + .todo-add { border-top: 0; }
    .todo-add input {
      flex: 1;
      width: auto;
      min-width: 0;
      margin-top: 0;
    }
    .todo-add button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #fffaf2;
      font-weight: 700;
      padding: 0 16px;
    }
    .fold { margin-top: 10px; }
    .fold summary {
      cursor: pointer;
      list-style: none;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 650;
      color: var(--terra-ink);
    }
    .fold summary::-webkit-details-marker { display: none; }
    .fold summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      flex: none;
    }
    .fold[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
    .steps { margin: 4px 0 0; padding-left: 1.15rem; }
    .steps li { margin: 0 0 8px; }
    .steps li::marker { color: var(--terra); font-weight: 700; }
    .places {
      list-style: none;
      margin: 6px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .place {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      padding: 5px 10px;
      color: inherit;
      text-decoration: none;
    }
    .place-name { display: flex; flex-direction: column; min-width: 0; }
    .place strong { font-size: 13px; font-weight: 650; }
    .place small { font-size: 11px; color: var(--muted); }
    .place span {
      margin-left: auto;
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    a.ref, a.call { text-decoration: none; color: inherit; }
    .card.note {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      color: var(--muted);
      padding: 2px 2px 8px;
    }
    .card.note h3 { font-size: 14px; font-weight: 600; margin: 0; }
    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }
    .meta h3 {
      margin: 0;
      flex: 1;
      min-width: 0;
    }
    .meta-end {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: none;
    }
    .edit {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      padding: 0;
    }
    .when {
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      font-size: 13px;
      color: var(--ink-2);
    }
    .card h3 {
      margin: 6px 0 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 650;
    }
    .card .meta h3 { margin: 0; }
    .sub, .extra { margin: 4px 0 0; color: var(--muted); }
    .refs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

    .ref strong, .pin strong {

    }
    .pin strong { font-size: 15px; letter-spacing: 0.06em; }

    .icon-link {
      width: 34px;
      min-height: 34px;
      border: 1px solid var(--line);

    .icon-link svg { width: 18px; height: 18px; }

      background: transparent;

    }
    .hosted {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);

    }
    .hosted a { color: inherit; }
    .tool-icon.busy, .tool-icon:disabled { opacity: 0.45; }
    .tool-icon {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-2);
      display: grid;
      place-items: center;
      padding: 0;
    }
    .plus {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;

      display: grid;

      padding: 0;
      margin-left: 4px;

    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 0 calc(24px + env(safe-area-inset-bottom));

    }
    .panel h2 { margin: 0; font-size: 22px; }
    #editor .ghost { align-self: flex-start; text-align: left; padding-left: 0; }
    .kinds { display: flex; gap: 8px; flex-wrap: wrap; margin: 0; }
    .kinds button, .row button {

    .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field-label { display: block; margin: 0 0 6px; font-size: 13px; color: var(--muted); }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--card);

    .panel input[type="color"] {
      width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 2px;
      border-radius: 50%;
      border: 2px solid var(--card);

    }
    label { display: block; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    .panel label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      min-width: 0;
    }
    input, select, textarea {
      width: 100%;
      max-width: 100%;

    .gate {

      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));

      border-radius: 999px;

      font-size: 14px;

    .toast[hidden] { display: none; }
    #app.is-day .extras { display: none; }
    @page { margin: 10mm; }
    #printSheet { display: none; }
    @media print {
      body.sheet-print { background: #fff; margin: 0; }
      body.sheet-print > *:not(#printSheet) { display: none !important; }
      body.sheet-print #printSheet { display: block !important; }
      .daynav, .tools, .filters, .pager, .fold, .steps, .places { display: none !important; }

  </style>
  <style id="sheetCss">
    @page { margin: 10mm; }
    html, body.sheet { margin: 0; color: #2b211c; background: #fff; }
    .sheet { font: 9.5pt/1.25 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet header { margin: 0 0 6px; padding: 0 0 4px; border-bottom: 2px solid #b5552f; }

</head>
<body>
  <div id="gate" class="gate">
    <form id="gateForm">
      <h1>Japan <span class="amp">&amp;</span> Bali</h1>
      <p class="lede">One word to open the itinerary on this phone.</p>

        <input id="word" name="password" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
      </label>
      <p id="gateErr" class="err"></p>

  </div>


  <div id="app" class="wrap" hidden>
    <header class="top">
      <div class="top-row">
        <div>
          <h1>Japan <span class="amp">&amp;</span> Bali</h1>
          <p class="lede" id="tripDates">November 2026</p>
        </div>
        <div class="tools">
          <button id="deployTrip" class="tool-icon" type="button" hidden aria-label="Deploy to PROD" title="Copy this itinerary to production">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3.5 17 8h-3v6h-4V8H7l5-4.5zM5 18h14v2H5v-2z"></path></svg>
          </button>
          <button id="printPlan" class="tool-icon" type="button" aria-label="Print" title="Print, or choose Save as PDF">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 3h10v4H7V3zm12 6H5a2 2 0 0 0-2 2v6h3v-3h12v3h3v-6a2 2 0 0 0-2-2zm-1 2.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zM8 16h8v5H8v-5z"></path></svg>
          </button>
          <button id="lock" class="tool-icon" type="button" aria-label="Lock" title="Lock the itinerary">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a4.5 4.5 0 0 0-4.5 4.5V9H6.5A1.5 1.5 0 0 0 5 10.5v9A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 17.5 9h-1V6.5A4.5 4.5 0 0 0 12 2zm0 2a2.5 2.5 0 0 1 2.5 2.5V9h-5V6.5A2.5 2.5 0 0 1 12 4zm0 10a1.5 1.5 0 0 1 .75 2.8V18a.75.75 0 0 1-1.5 0v-1.2A1.5 1.5 0 0 1 12 14z"></path></svg>
          </button>
          <button id="openAdd" class="plus" type="button" aria-label="Add booking">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M11 5h2v14h-2zM5 11h14v2H5z" fill="currentColor"></path></svg>
          </button>
        </div>
      </div>
      <p class="hosted" id="hosted" hidden></p>
    </header>
    <div class="layout">
      <nav id="dayNav" class="daynav" aria-label="Days"></nav>
      <main class="pane">
        <div class="filters">
          <div class="menu">
            <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filterPanel">
              <span id="filterLabel">Show all</span>
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="#7a6a5d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6L8 10.5 12.5 6"></path></svg>
            </button>
            <div id="filterPanel" class="filter-panel" hidden></div>
          </div>
        </div>
        <div id="days"></div>
        <div class="extras">
          <section class="day" id="totals" aria-labelledby="totalTitle" hidden>
            <div class="day-head">

          <button type="button" class="swatch" data-color="#e5f2eb" style="background:#e5f2eb" aria-label="Green"></button>
          <button type="button" class="swatch" data-color="#e7eef8" style="background:#e7eef8" aria-label="Blue"></button>
          <button type="button" class="swatch" data-color="#ffd7d3" style="background:#ffd7d3" aria-label="Red"></button>
          <button type="button" class="swatch" data-color="#f8e8f1" style="background:#f8e8f1" aria-label="Pink"></button>
          <button type="button" class="swatch" data-color="#f3e8ff" style="background:#f3e8ff" aria-label="Purple"></button>

      <div class="pair">

        </label>
        <label>Time
          <input name="time" type="time">

      </div>
      <div class="pair">

        <label>End time

            <option value="AUD">AUD</option>
            <option value="JPY">JPY</option>

  <script>
    const KINDS = {flight: "Flight", stay: "Accom", ticket: "Tickets", train: "Train", disney: "Disney", onsen: "Onsen", other: "Other"};
    const FILTER_TYPES = [
      ["all", "All"],
      ["flight", "Flight"],
      ["accom", "Accom"],
      ["train", "Train"],
      ["disney", "Disney"],
      ["ticket", "Tickets"],
      ["onsen", "Onsens"]
    ];
    const FILTER_LABELS = Object.fromEntries(FILTER_TYPES);
    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    const days = document.getElementById("days");
    const editor = document.getElementById("editor");
    const addForm = document.getElementById("addForm");
    const FALLBACK_RATES = {AUD: 1, JPY: 107.7, IDR: 10800, SGD: 0.86, USD: 0.66, EUR: 0.58, NZD: 1.1, GBP: 0.5};
    let kind = "flight";
    let typeFilters = new Set();
    let latestItems = [];
    let rates = FALLBACK_RATES;
    let insurance = null;
    let editingId = "";

    // Yen and rupiah are not written with cents, and converted figures are rounded.
    const WHOLE_UNIT = new Set(["JPY", "IDR", "KRW", "VND"]);

    function money(amount, currency, whole) {
      const code = rates[currency] ? currency : "AUD";
      const noCents = whole || (WHOLE_UNIT.has(code) && Number.isInteger(amount));
      const options = {style: "currency", currency: code, currencyDisplay: "narrowSymbol"};
      if (noCents) {
        options.minimumFractionDigits = 0;
        options.maximumFractionDigits = 0;
      }
      try {
        return new Intl.NumberFormat("en-AU", options).format(amount);
      } catch (error) {
        return code + " " + amount.toLocaleString("en-AU");
      }
    }

    function inAud(amount, currency) {
      const rate = rates[currency] || 1;
      return amount / rate;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null && text !== "") node.textContent = text;
      return node;
    }

    function parseDay(iso) {
      const [y, m, d] = String(iso || "").split("-").map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }

    function dayLabel(iso) {
      const date = parseDay(iso);
      if (!date) return iso;
      return date.toLocaleDateString("en-AU", {weekday: "short", day: "numeric", month: "short"});
    }

    function dayHead(iso) {
      const head = el("header", "day-head");
      const date = parseDay(iso);
      if (!date) {
        head.appendChild(el("h2", "", iso));
        return head;
      }
      head.appendChild(el("p", "day-kicker", date.toLocaleDateString("en-AU", {weekday: "long"})));
      head.appendChild(el("h2", "", date.toLocaleDateString("en-AU", {day: "numeric", month: "short"})));
      return head;
    }

    function stampFor(item) {
      const stamp = el("div", "stamp");
      const start = item.time && item.time !== "00:01" ? clock(item.time) : "";
      const sameDayEnd = item.endTime && (!item.endDate || item.endDate === item.date);
      if (start) stamp.appendChild(el("div", "", start));
      if (start && sameDayEnd && item.endTime !== item.time) stamp.appendChild(el("div", "stamp-end", clock(item.endTime)));
      return stamp;
    }

    function preferAppleMaps() {
      const ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/.test(ua)) return true;
      if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
      return /Macintosh|Mac OS X/.test(ua);
    }

    function appleMapsUrl(googleHref) {
      let url;
      try { url = new URL(googleHref); } catch (error) { return ""; }
      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      if (host !== "google.com" && host !== "maps.google.com") return "";
      if (!url.pathname.includes("/maps")) return "";
      const query = url.searchParams.get("query") || "";
      const origin = url.searchParams.get("origin") || "";
      const destination = url.searchParams.get("destination") || "";
      const flags = {walking: "w", transit: "r", driving: "d", bicycling: "b"};
      if (origin && destination) {
        const params = new URLSearchParams({saddr: origin, daddr: destination});
        const flag = flags[url.searchParams.get("travelmode") || ""];
        if (flag) params.set("dirflg", flag);
        return "https://maps.apple.com/?" + params.toString();
      }
      const place = decodeURIComponent((url.pathname.match(/\/maps\/place\/([^/]+)/) || [])[1] || "").replace(/\+/g, " ");
      const q = query || place;
      if (!q) return "";
      return "https://maps.apple.com/?q=" + encodeURIComponent(q);
    }

    function mapChoice(href) {
      const apple = appleMapsUrl(href);
      if (!apple) return {href: href, brand: ""};
      if (preferAppleMaps()) return {href: apple, brand: "Apple"};
      return {href: href, brand: "Google"};
    }

    function clock(value) {
      if (!value) return "";
      const [h, m] = value.split(":").map(Number);
      const hr = h % 12 || 12;
      return hr + ":" + String(m).padStart(2, "0") + (h < 12 ? "am" : "pm");
    }

    function spanLabel(item) {
      if (!item.endDate || item.endDate === item.date) return "";
      const start = parseDay(item.date);
      const end = parseDay(item.endDate);
      if (!start || !end) return "";
      const nights = Math.round((end - start) / 86400000);
      const nightsLabel = item.kind === "stay" && nights > 0 ? nights + (nights === 1 ? " night" : " nights") + " · " : "";
      return nightsLabel + dayLabel(item.date) + " – " + dayLabel(item.endDate);
    }

    async function api(path, options) {
      const response = await fetch(path, Object.assign({credentials: "same-origin", headers: {"Content-Type": "application/json"}}, options || {}));
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(payload.error || "Something went wrong.");
        error.locked = !!payload.locked || response.status === 401;
        throw error;
      }
      return payload;
    }

    function showGate(message) {
      app.hidden = true;
      editor.hidden = true;
      gate.hidden = false;
      const err = document.getElementById("gateErr");
      err.classList.remove("ok");
      err.textContent = message || "";
    }

    function showApp() {
      gate.hidden = true;
      editor.hidden = true;
      app.hidden = false;
    }

    function showEditor() {
      gate.hidden = true;
      app.hidden = true;
      editor.hidden = false;
      window.scrollTo(0, 0);
    }

    function copyText(value, button) {
      const done = () => {
        const previous = button.querySelector("strong").textContent;
        button.querySelector("strong").textContent = "Copied";
        setTimeout(() => { button.querySelector("strong").textContent = previous; }, 900);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done).catch(done);
      } else {
        done();
      }
    }

    function categoryOf(item) {
      if (item.category) return item.category;
      if (item.kind === "stay") return "accom";
      if (item.kind === "ticket" && /disney/i.test(String(item.title || "") + String(item.subtitle || ""))) return "disney";
      if (item.kind === "flight" || item.kind === "train" || item.kind === "ticket" || item.kind === "disney" || item.kind === "onsen") return item.kind;
      return "";
    }

    const TODO_FALLBACK = [
      {id: "tokyo-after-disney", text: "Tokyo accom after Disney checkout"},
      {id: "kyoto-train", text: "Kyoto train"},
      {id: "kyoto-accom", text: "Kyoto accom"},
      {id: "singapore-accom", text: "Singapore accom"},
      {id: "bali-accom", text: "Bali accom"},
      {id: "bali-flight-home", text: "Bali flight back to Melbourne"}
    ];

    function removedTodoIds() {
      try {
        const saved = JSON.parse(localStorage.getItem("trip-todos-removed") || "[]");
        return new Set(Array.isArray(saved) ? saved : []);
      } catch (error) {
        return new Set();
      }
    }

    function hideTodo(id) {
      const ids = removedTodoIds();
      ids.add(id);
      localStorage.setItem("trip-todos-removed", JSON.stringify([...ids]));
      localStorage.setItem("trip-todos-added", JSON.stringify(addedTodos().filter(item => item.id !== id)));
    }

    function addedTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem("trip-todos-added") || "[]");
        return Array.isArray(saved) ? saved.filter(item => item && item.id && item.text) : [];
      } catch (error) {
        return [];
      }
    }

    function todoRows(todos) {
      const source = Array.isArray(todos) ? todos : TODO_FALLBACK;
      const gone = removedTodoIds();
      const seen = new Set();
      const rows = [];
      source.concat(addedTodos()).forEach(item => {
        if (!item || !item.id || !item.text || gone.has(item.id) || seen.has(item.id)) return;
        seen.add(item.id);
        rows.push({id: item.id, text: String(item.text)});
      });
      return rows;
    }

    function renderTotals(items) {
      const section = document.getElementById("totals");
      const sum = document.getElementById("totalSum");
      const lines = document.getElementById("totalLines");
      const note = document.getElementById("totalNote");
      const priced = items.filter(item => item.cost > 0);
      if (insurance && insurance.cost > 0) {
        priced.push({cost: insurance.cost, currency: insurance.currency || "AUD", synthetic: true});
      }
      lines.replaceChildren();
      if (!priced.length) {
        section.hidden = true;
        return;
      }
      section.hidden = false;
      const byCurrency = new Map();
      priced.forEach(item => {
        const code = rates[item.currency] ? item.currency : "AUD";
        byCurrency.set(code, (byCurrency.get(code) || 0) + item.cost);
      });
      let aud = 0;
      [...byCurrency.entries()].sort((a, b) => inAud(b[1], b[0]) - inAud(a[1], a[0])).forEach(([code, amount]) => {
        aud += inAud(amount, code);
        const row = el("li");
        row.appendChild(el("span", "who", code));
        row.appendChild(el("span", "", money(amount, code)));
        lines.appendChild(row);
      });
      sum.textContent = "About " + money(aud, "AUD", true);
      const missing = items.filter(item => !item.synthetic && !(item.cost > 0)).length;
      const parts = [];
      if (missing) parts.push(missing === 1 ? "1 booking has no cost yet." : missing + " bookings have no cost yet.");
      parts.push("Converted at ¥" + rates.JPY + ", Rp " + rates.IDR.toLocaleString("en-AU") + " and S$" + rates.SGD + " to the dollar.");
      note.textContent = parts.join(" ");
    }

    function contactRow(entry) {
      const row = document.createElement("li");
      row.appendChild(el("span", "", entry.label));
      if (entry.href) {
        const link = document.createElement("a");
        link.href = entry.href;
        link.textContent = entry.value;
        row.appendChild(link);
      } else {
        row.appendChild(el("strong", "", entry.value));
      }
      return row;
    }

    function renderInsurance(cover) {
      if (cover) insurance = cover;
      const section = document.getElementById("insurance");
      const card = document.getElementById("insureCard");
      if (!insurance || !insurance.policy) {
        section.hidden = true;
        return;
      }
      section.hidden = false;
      card.replaceChildren();
      const top = el("div", "insure-top");
      const titles = el("div");
      titles.appendChild(el("h3", "", insurance.title || "Travel insurance"));
      titles.appendChild(el("p", "sub", insurance.plan + " · " + insurance.destinations));
      top.appendChild(titles);
      if (insurance.fileName) {
        const clip = document.createElement("a");
        clip.className = "icon-link clip";
        clip.href = "/trip/file/" + encodeURIComponent(insurance.id);
        clip.target = "_blank";
        clip.rel = "noopener";
        clip.title = insurance.fileName;
        clip.setAttribute("aria-label", "Open " + insurance.fileName);
        clip.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.1 11.4l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"></path></svg>';
        top.appendChild(clip);
      }
      card.appendChild(top);
      const facts = el("ul", "insure-facts");
      [
        ["Policy", insurance.policy],
        ["Travellers", insurance.travellers],
        ["Cover", insurance.dates],
        ["Premium", money(insurance.cost, insurance.currency)],
        ["Excess", money(insurance.excess, "AUD", true)],
        ["Overseas medical", insurance.medical],
      ].forEach(([label, value]) => {
        const row = document.createElement("li");
        row.appendChild(el("span", "", label));
        row.appendChild(el("strong", "", value));
        facts.appendChild(row);
      });
      card.appendChild(facts);
      const emergency = el("div", "insure-group");
      emergency.appendChild(el("h4", "", "24-hour emergency"));
      const emergencyList = document.createElement("ul");
      (insurance.emergency || []).forEach(entry => emergencyList.appendChild(contactRow(entry)));
      emergency.appendChild(emergencyList);
      card.appendChild(emergency);
      const service = el("div", "insure-group");
      service.appendChild(el("h4", "", "World Nomads"));
      const serviceList = document.createElement("ul");
      (insurance.service || []).forEach(entry => serviceList.appendChild(contactRow(entry)));
      service.appendChild(serviceList);
      card.appendChild(service);
    }

    let todoSource = null;

    function renderTodos(todos) {
      if (Array.isArray(todos)) todoSource = todos;
      const section = document.getElementById("todos");
      const list = document.getElementById("todoList");
      const rows = todoRows(todoSource);
      list.replaceChildren();
      section.hidden = false;
      rows.forEach((item, index) => {
        const row = el("li");
        const label = el("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.addEventListener("change", () => row.classList.toggle("picked", box.checked));
        label.appendChild(box);
        label.appendChild(el("span", "n", String(index + 1)));
        label.appendChild(document.createTextNode(item.text));
        const remove = el("button", "todo-delete", "Delete");
        remove.type = "button";
        remove.addEventListener("click", () => {
          hideTodo(item.id);
          renderTodos(rows.filter(entry => entry.id !== item.id));
          fetch("/trip/api/todos/delete", {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({id: item.id})
          }).catch(() => {});
        });
        row.appendChild(label);
        row.appendChild(remove);
        list.appendChild(row);
      });
    }

    document.getElementById("todoAdd").addEventListener("submit", event => {
      event.preventDefault();
      const input = event.target.elements.text;
      const text = input.value.trim().slice(0, 140);
      if (!text) return;
      const item = {id: "todo-" + Date.now().toString(36), text};
      const saved = addedTodos();
      saved.push(item);
      localStorage.setItem("trip-todos-added", JSON.stringify(saved.slice(-40)));
      input.value = "";
      renderTodos(todoSource);
      fetch("/trip/api/todos", {
        method: "POST",
        credentials: "same-origin",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(item)
      }).catch(() => {});
    });

    // Every row the page can show, including the checkout and landing notes made from
    // multi-day stays and flights. Nothing here is saved; it only shapes the view.
    function expandRows(items) {
      const rows = items.slice();
      items.forEach(item => {
        if (item.kind === "stay" && item.endDate && item.endDate !== item.date) {
          rows.push({
            id: item.id + "-out",
            photoId: item.id,
            photoStamp: item.photoStamp,
            kind: "note",
            category: "accom",
            title: "Checkout · " + item.title,
            date: item.endDate,
            time: item.endTime || "00:01",
            synthetic: true
          });
        }
        if (item.kind === "flight" && item.endDate && item.endDate !== item.date) {
          const place = String(item.title || "").split(" to ").pop() || item.title;
          rows.push({
            id: item.id + "-land",
            photoId: item.id,
            photoStamp: item.photoStamp,
            kind: "flight",
            category: "flight",
            title: "Land · " + place,
            date: item.endDate,
            time: item.endTime || "00:01",
            synthetic: true
          });
        }
      });
      return rows;
    }

    // Without a time, a stay reads better after the travel that gets you there,
    // and an optional onsen reads better last.
    function sortRows(rows) {
      const untimedRank = item => {
        if (item.time) return "0";
        if (item.kind === "onsen") return "2";
        return item.kind === "stay" ? "1" : "0";
      };
      const sortKey = item => item.date + (item.time || "99:99") + untimedRank(item) + (item.title || "");
      return rows.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
    }

    function passesFilter(item) {
      return typeFilters.size === 0 || typeFilters.has(categoryOf(item));
    }

    function visibleRows(items) {
      const rows = expandRows(items);
      syncFilters(rows);
      return sortRows(rows.filter(passesFilter));
    }

    // ---- Day navigation (presentation only) ----
    const ICONS = {
      flight: '<path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"></path>',
      train: '<path fill="currentColor" d="M12 2C8 2 4 2.5 4 6v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2.2l2-2h3.6l2 2H18v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"></path>',
      disney: '<path fill="currentColor" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>',
      ticket: '<path fill="currentColor" d="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"></path>',
      onsen: '<path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M7 3.5c-1.4 1.8 1.4 2.7 0 4.5M12 3.5c-1.4 1.8 1.4 2.7 0 4.5M17 3.5c-1.4 1.8 1.4 2.7 0 4.5M3.5 12.5h17v3.5a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4z"></path>',
      accom: '<path fill="currentColor" d="M7 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4z"></path>',
      free: '<circle cx="12" cy="12" r="3.2" fill="currentColor"></circle>',
      overview: '<path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path>'
    };
    const ICON_ORDER = ["flight", "train", "disney", "ticket", "onsen", "accom"];

    function iconSvg(name) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.free) + "</svg>";
    }

    // One script city word per day, only when the titles make it obvious.
    const CITY_RULES = [
      ["Tokyo", /\b(tokyo|shinjuku|akihabara|narita|haneda|maihama|disney|shibuya|asakusa|ueno|ginza)\b/i],
      ["Kyoto", /\bkyoto\b/i],
      ["Osaka", /\bosaka\b/i],
      ["Singapore", /\b(singapore|changi)\b/i],
      ["Bali", /\b(bali|ubud|seminyak|canggu|denpasar|uluwatu|sanur|kuta)\b/i],
      ["Cairns", /\bcairns\b/i],
      ["Melbourne", /\bmelbourne\b/i]
    ];

    function cityIn(text) {
      const value = String(text || "");
      for (const [name, pattern] of CITY_RULES) {
        if (pattern.test(value)) return name;
      }
      return "";
    }

    function destinationText(item) {
      const title = String(item.title || "").replace(/^(land|checkout)\s*·\s*/i, "");
      const parts = title.split(/\s+to\s+/i);
      return parts[parts.length - 1];
    }

    function isoOf(date) {
      return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
    }

    function todayIso() {
      return isoOf(new Date());
    }

    function stayFor(iso, items) {
      return items.find(item => item.kind === "stay" && item.date && item.date <= iso
        && (item.endDate && item.endDate > item.date ? iso < item.endDate : item.date === iso)) || null;
    }

    let dayList = [];
    let view = "";

    function buildDays(items) {
      const rows = sortRows(expandRows(items)).filter(item => parseDay(item.date));
      const byDate = new Map();
      rows.forEach(item => {
        if (!byDate.has(item.date)) byDate.set(item.date, []);
        byDate.get(item.date).push(item);
      });
      let dates = [...byDate.keys()].sort();
      if (dates.length > 1) {
        // Fill the quiet days between bookings, unless the dates are far apart.
        const first = parseDay(dates[0]);
        const last = parseDay(dates[dates.length - 1]);
        const span = Math.round((last - first) / 86400000);
        if (span <= 60) {
          dates = [];
          for (let step = 0; step <= span; step += 1) {
            dates.push(isoOf(new Date(first.getFullYear(), first.getMonth(), first.getDate() + step)));
          }
        }
      }
      const stayCity = new Map();
      let lastCity = "";
      return dates.map((iso, index) => {
        const dayRows = byDate.get(iso) || [];
        const stay = stayFor(iso, items);
        let city = "";
        for (let i = dayRows.length - 1; i >= 0 && !city; i -= 1) {
          if (dayRows[i].kind === "flight" || dayRows[i].kind === "train") city = cityIn(destinationText(dayRows[i]));
        }
        if (!city && stay) city = cityIn(stay.title + " " + (stay.subtitle || "")) || stayCity.get(stay.id) || "";
        for (let i = dayRows.length - 1; i >= 0 && !city; i -= 1) {
          city = cityIn(dayRows[i].title + " " + (dayRows[i].subtitle || ""));
        }
        if (!city && stay) city = lastCity;
        if (stay && city && !stayCity.has(stay.id)) stayCity.set(stay.id, city);
        if (city) lastCity = city;
        const cats = new Set(dayRows.map(categoryOf));
        const icon = ICON_ORDER.find(name => cats.has(name)) || (dayRows.length ? "free" : "free");
        return {iso, n: index + 1, rows: dayRows, stay, city, icon, empty: !dayRows.length};
      });
    }

    function dayByIso(iso) {
      return dayList.find(day => day.iso === iso) || null;
    }

    // During the trip open on today. Before it, Day 1. After it, the overview.
    function defaultView() {
      if (!dayList.length) return "overview";
      const today = todayIso();
      if (today < dayList[0].iso) return dayList[0].iso;
      if (today > dayList[dayList.length - 1].iso) return "overview";
      const match = dayList.find(day => day.iso >= today);
      return match ? match.iso : "overview";
    }

    function viewFromHash() {
      const raw = decodeURIComponent(String(location.hash || "").replace(/^#/, ""));
      if (raw === "overview") return "overview";
      const iso = raw.replace(/^day-/, "");
      return dayByIso(iso) ? iso : "";
    }

    function setView(next, options) {
      const opts = options || {};
      if (!next) return;
      view = next;
      const hash = "#" + (next === "overview" ? "overview" : "day-" + next);
      if (location.hash !== hash) {
        try { history.pushState(null, "", hash); } catch (error) { location.hash = hash; }
      }
      paintNav();
      paintView();
      if (!opts.keepScroll) {
        // Start the new day at its top, with the header just scrolled away on a phone.
        const wide = window.matchMedia("(min-width: 900px)").matches;
        const top = wide ? 0 : Math.max(0, app.querySelector(".layout").offsetTop);
        if (window.scrollY > top) window.scrollTo(0, top);
      }
    }

    window.addEventListener("popstate", () => {
      const next = viewFromHash() || defaultView();
      if (next === view) return;
      view = next;
      paintNav();
      paintView();
    });

    function shortDay(iso) {
      const date = parseDay(iso);
      if (!date) return iso;
      return date.toLocaleDateString("en-AU", {weekday: "short", day: "numeric", month: "short"}).replace(/,/g, "");
    }

    function navButton(key, icon, label, small, rail, extraClass) {
      const button = el("button", "day-btn" + (extraClass ? " " + extraClass : ""));
      button.type = "button";
      button.dataset.view = key;
      const circle = el("span", "circle");
      circle.innerHTML = iconSvg(icon);
      button.appendChild(circle);
      const dlabel = el("span", "dlabel");
      dlabel.appendChild(el("b", "", label));
      dlabel.appendChild(document.createTextNode(small));
      button.appendChild(dlabel);
      const text = el("span", "rail-text");
      text.appendChild(el("strong", "", rail[0]));
      if (rail[1]) text.appendChild(el("small", "", rail[1]));
      button.appendChild(text);
      return button;
    }

    function paintNav() {
      const nav = document.getElementById("dayNav");
      nav.replaceChildren();
      const today = todayIso();
      nav.appendChild(navButton("overview", "overview", "All", "days", ["Overview", "Every day, cost, insurance"], "overview"));
      dayList.forEach(day => {
        const date = parseDay(day.iso);
        const classes = [];
        if (day.iso === today) classes.push("today");
        if (day.empty) classes.push("free");
        const railSmall = ["Day " + day.n, day.city].filter(Boolean).join(" · ");
        const button = navButton(day.iso, day.icon, String(date.getDate()), date.toLocaleDateString("en-AU", {weekday: "short"}), [shortDay(day.iso), railSmall], classes.join(" "));
        button.setAttribute("aria-label", "Day " + day.n + ", " + date.toLocaleDateString("en-AU", {weekday: "long", day: "numeric", month: "long"}) + (day.city ? ", " + day.city : ""));
        nav.appendChild(button);
      });
      let current = null;
      nav.querySelectorAll(".day-btn").forEach(button => {
        const on = button.dataset.view === view;
        button.setAttribute("aria-current", on ? "true" : "false");
        if (on) current = button;
      });
      if (current) {
        requestAnimationFrame(() => {
          if (nav.scrollWidth > nav.clientWidth) {
            nav.scrollLeft = current.offsetLeft - (nav.clientWidth - current.offsetWidth) / 2;
          }
          if (nav.scrollHeight > nav.clientHeight) {
            const top = current.offsetTop - nav.offsetTop;
            if (top < nav.scrollTop || top > nav.scrollTop + nav.clientHeight - current.offsetHeight) {
              nav.scrollTop = top - (nav.clientHeight - current.offsetHeight) / 2;
            }
          }
        });
      }
    }

    document.getElementById("dayNav").addEventListener("click", event => {
      const button = event.target.closest(".day-btn");
      if (!button) return;
      setView(button.dataset.view);
    });

    function timelineFor(group) {
      const list = el("ol", "timeline");
      group.forEach(item => {
        const slot = el("li", "slot " + (item.kind || "other"));
        slot.appendChild(stampFor(item));
        slot.appendChild(el("div", "mark"));
        slot.appendChild(card(item));
        list.appendChild(slot);
      });
      return list;
    }

    function headFor(day, linked) {
      const head = el("header", "day-head");
      const date = parseDay(day.iso);
      const kicker = "Day " + day.n + " · " + date.toLocaleDateString("en-AU", {weekday: "long"}) + (day.iso === todayIso() ? " · Today" : "");
      head.appendChild(el("p", "day-kicker", kicker));
      const title = el("h2", "", date.toLocaleDateString("en-AU", {day: "numeric", month: "long"}));
      if (day.city) title.appendChild(el("span", "city", day.city));
      head.appendChild(title);
      if (!linked) return head;
      const link = el("button", "day-link");
      link.type = "button";
      link.setAttribute("aria-label", "Open day " + day.n);
      link.appendChild(head);
      link.addEventListener("click", () => setView(day.iso));
      return link;
    }

    // A photo saved for one of the day's bookings in trip_photos/. No other source.
    function heroFor(day) {
      const pick = day.rows.find(item => !item.synthetic && item.photoStamp)
        || day.rows.find(item => item.photoStamp);
      if (!pick) return null;
      const photoId = pick.photoId || pick.id;
      const figure = el("figure", "hero");
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      img.src = "/trip/photo/" + encodeURIComponent(photoId) + "?v=" + encodeURIComponent(pick.photoStamp);
      img.addEventListener("error", () => figure.remove());
      figure.appendChild(img);
      return figure;
    }

    function pagerFor(day) {
      const index = dayList.indexOf(day);
      const pager = el("nav", "pager");
      pager.setAttribute("aria-label", "Previous and next day");
      const prev = el("button", "prev");
      prev.type = "button";
      const next = el("button", "next");
      next.type = "button";
      const before = dayList[index - 1];
      const after = dayList[index + 1];
      prev.appendChild(el("span", "", "Previous"));
      prev.appendChild(el("strong", "", before ? shortDay(before.iso) : ""));
      next.appendChild(el("span", "", "Next"));
      next.appendChild(el("strong", "", after ? shortDay(after.iso) : ""));
      prev.disabled = !before;
      next.disabled = !after;
      if (before) prev.addEventListener("click", () => setView(before.iso));
      if (after) next.addEventListener("click", () => setView(after.iso));
      pager.appendChild(prev);
      pager.appendChild(next);
      return pager;
    }

    function stepDay(delta) {
      if (view === "overview") return;
      const day = dayByIso(view);
      const index = dayList.indexOf(day);
      const target = dayList[index + delta];
      if (target) setView(target.iso);
    }

    function paintView() {
      days.replaceChildren();
      const dayMode = view !== "overview" && !!dayByIso(view);
      app.classList.toggle("is-day", dayMode);
      if (dayMode) {
        const day = dayByIso(view);
        const block = el("section", "day one-day");
        block.appendChild(headFor(day, false));
        const hero = heroFor(day);
        if (hero) block.appendChild(hero);
        const shown = day.rows.filter(passesFilter);
        if (shown.length) {
          block.appendChild(timelineFor(shown));
        } else {
          const free = el("p", "free-day");
          free.appendChild(document.createTextNode(day.rows.length ? "Nothing on this day matches the filter." : "No bookings on this day."));
          if (day.stay) {
            free.appendChild(document.createTextNode(" Staying at "));
            free.appendChild(el("strong", "", day.stay.title));
            free.appendChild(document.createTextNode("."));
          }
          block.appendChild(free);
        }
        block.appendChild(pagerFor(day));
        days.appendChild(block);
        return;
      }
      if (!dayList.length) {
        days.appendChild(el("p", "empty", "Nothing booked yet."));
        return;
      }
      let any = false;
      dayList.forEach(day => {
        const shown = day.rows.filter(passesFilter);
        if (!shown.length) return;
        any = true;
        const block = el("section", "day");
        block.appendChild(headFor(day, true));
        block.appendChild(timelineFor(shown));
        days.appendChild(block);
      });
      if (!any) days.appendChild(el("p", "empty", "Nothing matches."));
    }

    function paintTripDates() {
      const node = document.getElementById("tripDates");
      if (!dayList.length) return;
      const first = parseDay(dayList[0].iso);
      const last = parseDay(dayList[dayList.length - 1].iso);
      const sameYear = first.getFullYear() === last.getFullYear();
      const start = first.toLocaleDateString("en-AU", sameYear ? {day: "numeric", month: "short"} : {day: "numeric", month: "short", year: "numeric"});
      const end = last.toLocaleDateString("en-AU", {day: "numeric", month: "short", year: "numeric"});
      node.textContent = start + " – " + end;
    }

    function render(items) {
      latestItems = items;
      renderTotals(items);
      syncFilters(expandRows(items));
      dayList = buildDays(items);
      paintTripDates();
      if (!view || (view !== "overview" && !dayByIso(view))) {
        view = viewFromHash() || defaultView();
      }
      paintNav();
      paintView();
    }

    document.addEventListener("keydown", event => {
      if (app.hidden || event.altKey || event.ctrlKey || event.metaKey) return;
      const target = event.target;
      if (target && (target.closest("input, textarea, select") || target.isContentEditable)) return;
      if (event.key === "ArrowLeft") stepDay(-1);
      if (event.key === "ArrowRight") stepDay(1);
    });

    // A sideways swipe on the day moves to the next or previous day.
    (() => {
      let startX = 0;
      let startY = 0;
      let tracking = false;
      days.addEventListener("touchstart", event => {
        if (event.touches.length !== 1) { tracking = false; return; }
        tracking = true;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }, {passive: true});
      days.addEventListener("touchend", event => {
        if (!tracking) return;
        tracking = false;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) stepDay(dx < 0 ? 1 : -1);
      }, {passive: true});
    })();

    // The thumbnail and the icon links share one column down the left of the card.
    function attachPhoto(node, item, icons) {
      const rail = el("div", "rail");
      if (icons && icons.childNodes.length) rail.appendChild(icons);
      const photoId = item.photoId || item.id;
      if (!photoId) {
        if (rail.childNodes.length) {
          node.classList.add("with-rail");
          node.insertBefore(rail, node.firstChild);
        }
        return;
      }
      const img = document.createElement("img");
      img.className = "thumb";
      img.alt = "";
      img.width = 72;
      img.height = 72;
      img.decoding = "async";
      img.loading = "eager";
      img.src = "/trip/photo/" + encodeURIComponent(photoId) + (item.photoStamp ? "?v=" + encodeURIComponent(item.photoStamp) : "");
      img.addEventListener("error", () => {
        img.remove();
        node.classList.remove("with-photo");
        if (!rail.childNodes.length) {
          rail.remove();
          node.classList.remove("with-rail");
        }
      });
      node.classList.add("with-photo");
      node.classList.add("with-rail");
      rail.insertBefore(img, rail.firstChild);
      node.insertBefore(rail, node.firstChild);
    }

          typeFilters.clear();

    const deployButton = document.getElementById("deployTrip");

    function showDeploy(state) {
      if (!deployButton) return;
      deployButton.hidden = !state.local;
      deployButton.disabled = !!state.running;
      deployButton.classList.toggle("busy", !!state.running);
      deployButton.title = state.running ? "Copying to production" : "Copy this itinerary to production";
      const hosted = document.getElementById("hosted");
      if (!state.local) {
        hosted.hidden = true;
        return;
      }
      if (state.running) {
        hosted.hidden = false;
        hosted.textContent = "Copying this itinerary to production…";
      } else if (state.succeeded === false && state.error) {
        hosted.hidden = false;
        hosted.textContent = state.error;
      } else if (state.url) {
        hosted.hidden = false;
        hosted.replaceChildren();
        const link = document.createElement("a");
        link.href = state.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Open production";
        hosted.appendChild(link);
      }
      if (state.running && !deployPoll) {
        deployPoll = window.setInterval(() => {
          refreshDeploy().catch(() => {});
        }, 2000);
      }
      if (!state.running && deployPoll) {
        window.clearInterval(deployPoll);
        deployPoll = 0;
      }
    }
    function refreshDeploy() {
      return api("/trip/api/deploy").then(showDeploy);

    deployButton.addEventListener("click", async () => {
      if (!window.confirm("Copy this itinerary to production on Railway?")) return;
      deployButton.disabled = true;
      deployButton.classList.add("busy");
      try {
        showDeploy(await api("/trip/api/deploy", {method: "POST", body: "{}"}));
      } catch (error) {
        const hosted = document.getElementById("hosted");
        hosted.hidden = false;
        hosted.textContent = error.message;
        deployButton.disabled = false;
        deployButton.classList.remove("busy");

    function hourMinute(value) {
      const [h, m] = String(value || "").split(":").map(Number);
      if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
      return {h, m};
    }

    function compactClock(parts, withMeridiem) {
      const text = (parts.h % 12 || 12) + ":" + String(parts.m).padStart(2, "0");
      if (!withMeridiem) return text;
      return text + (parts.h < 12 ? "am" : "pm");
    }

    function timeRange(item) {
      const start = item.time && item.time !== "00:01" ? hourMinute(item.time) : null;
      if (!start) return "";
      const sameDay = !item.endDate || item.endDate === item.date;
      const end = sameDay && item.endTime && item.endTime !== item.time && item.endTime !== "00:01" ? hourMinute(item.endTime) : null;
      if (!end) return compactClock(start, true);
      const sameMeridiem = (start.h < 12) === (end.h < 12);
      if (sameMeridiem) return compactClock(start, false) + "\u2013" + compactClock(end, true);
      return compactClock(start, true) + "\u2013" + compactClock(end, true);
    }

    function keyDetail(item) {
      if (item.synthetic) return "";
      const parts = [];
      let lead = String(item.subtitle || "").split(" \u00b7 ")[0].trim();
      const comma = lead.indexOf(",");
      if (comma > 8) lead = lead.slice(0, comma).trim();
      if (lead) parts.push(lead);
      const nights = String(spanLabel(item) || "").match(/^(\d+ nights?)/);
      if (nights) parts.push(nights[1]);
      if (item.cost > 0) parts.push(money(item.cost, item.currency));
      const detail = String(item.detail || "").trim();
      if (detail && !/^pin\s+/i.test(detail)) {
        const text = detail.length <= 42 ? detail : detail.split(" \u00b7 ")[0].trim();
        const digits = text.replace(/[^\d.]/g, "");
        const sameCost = item.cost > 0 && digits === String(item.cost).replace(/\.0+$/, "");
        if (text && text !== lead && !sameCost) parts.push(text);
      }
      return parts.join(" \u00b7 ");
    }

    function printDayLabel(iso) {
      const date = parseDay(iso);
      if (!date) return iso || "";
      return date.toLocaleDateString("en-AU", {weekday: "short", day: "numeric", month: "short"}).replace(/,/g, "");
    }

    function printEvent(item) {
      const node = el("article", "event k-" + (item.kind || "other"));
      const main = el("p", "main");
      const when = timeRange(item);
      if (when) main.appendChild(el("span", "when", when));
      main.appendChild(el("span", "title", item.title || ""));
      node.appendChild(main);
      const detail = keyDetail(item);
      if (detail) node.appendChild(el("p", "detail", detail));
      return node;
    }

    function fillPrintSheet() {
      const sheet = document.getElementById("printSheet");
      sheet.replaceChildren();
      const head = document.createElement("header");
      head.appendChild(el("h1", "", "Japan & Bali"));
      head.appendChild(el("p", "lede", document.getElementById("tripDates").textContent || "November 2026"));
      sheet.appendChild(head);
      const shown = visibleRows(latestItems);
      if (!shown.length) {
        sheet.appendChild(el("p", "detail", "Nothing matches."));
        return sheet;
      }
      const groups = new Map();
      shown.forEach(item => {
        if (!groups.has(item.date)) groups.set(item.date, []);
        groups.get(item.date).push(item);
      });
      groups.forEach((group, iso) => {
        const block = el("section", "day");
        const keep = el("div", "keep");
        const dayHeadNode = el("h2", "day-head", printDayLabel(iso));
        const city = (dayByIso(iso) || {}).city;
        if (city) dayHeadNode.appendChild(el("span", "city", city));
        keep.appendChild(dayHeadNode);
        keep.appendChild(printEvent(group[0]));
        block.appendChild(keep);
        group.slice(1).forEach(entry => block.appendChild(printEvent(entry)));
        sheet.appendChild(block);
      });
      return sheet;
    }

    function printDocumentHtml() {
      const sheet = fillPrintSheet();
      const css = document.getElementById("sheetCss").textContent;
      return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Japan and Bali itinerary</title><style>" + css + "</style></head><body class='sheet'><p class='go'><button type='button' onclick='window.print()'>Print</button></p>" + sheet.innerHTML + "</body></html>";
    }

    document.getElementById("printPlan").addEventListener("click", () => {
      const html = printDocumentHtml();
      const popup = window.open("", "_blank");
      if (!popup) {
        document.body.classList.add("sheet-print");
        window.print();
        return;
      }
      popup.document.open();
      popup.document.write(html);
      popup.document.close();
      popup.focus();
      setTimeout(() => popup.print(), 150);
    });

    window.addEventListener("beforeprint", () => {
      fillPrintSheet();
      document.body.classList.add("sheet-print");
    });
    window.addEventListener("afterprint", () => {
      document.body.classList.remove("sheet-print");
    });

    document.getElementById("lock").addEventListener("click", async () => {
      await api("/trip/api/lock", {method: "POST", body: "{}"});
      document.getElementById("word").value = "";
      showGate("");
    });

    function setKind(next) {
      kind = next || "flight";
      document.querySelectorAll("#kinds button").forEach(item => item.classList.toggle("on", item.dataset.kind === kind));
    }

    function setColor(value) {
      const color = /^#[0-9a-f]{6}$/i.test(value || "") ? value.toLowerCase() : "";
      addForm.elements.color.value = color;
      document.querySelectorAll("#swatches .swatch").forEach(button => {
        button.classList.toggle("on", (button.dataset.color || "") === color);
      });
      if (color) document.getElementById("customColor").value = color;
    }

    document.getElementById("swatches").addEventListener("click", event => {
      const button = event.target.closest(".swatch");
      if (!button) return;
      setColor(button.dataset.color || "");
    });

    document.getElementById("customColor").addEventListener("input", event => {
      setColor(event.target.value);
    });

    function openAdd() {
      editingId = "";
      document.getElementById("sheetTitle").textContent = "Add booking";
      document.getElementById("saveBooking").textContent = "Add to itinerary";
      document.getElementById("removeBooking").hidden = true;
      document.getElementById("addErr").textContent = "";
      addForm.reset();
      setKind("flight");
      setColor("");
      showEditor();
      addForm.elements.title.focus();
    }

    function openEdit(item) {
      editingId = item.id;
      document.getElementById("sheetTitle").textContent = "Edit booking";
      document.getElementById("saveBooking").textContent = "Save";
      document.getElementById("removeBooking").hidden = !!item.seed;
      document.getElementById("addErr").textContent = "";
      addForm.elements.title.value = item.title || "";
      addForm.elements.date.value = item.date || "";
      addForm.elements.time.value = item.time || "";
      addForm.elements.endDate.value = item.endDate || "";
      addForm.elements.endTime.value = item.endTime || "";
      addForm.elements.booking.value = item.booking || "";
      addForm.elements.cost.value = item.cost > 0 ? String(item.cost) : "";
      addForm.elements.currency.value = item.currency || "AUD";
      addForm.elements.detail.value = item.detail || "";
      addForm.elements.notes.value = item.notes || "";
      setKind(item.kind === "other" ? "flight" : item.kind);
      setColor(item.color || "");
      showEditor();
      addForm.elements.title.focus();
    }

    document.getElementById("openAdd").addEventListener("click", openAdd);
    document.getElementById("closeAdd").addEventListener("click", () => showApp());
    document.getElementById("removeBooking").addEventListener("click", async () => {
      if (!editingId || !confirm("Remove this booking?")) return;
      const err = document.getElementById("addErr");
      err.textContent = "";
      try {
        const payload = await api("/trip/api/items/delete", {method: "POST", body: JSON.stringify({id: editingId})});
        editingId = "";
        addForm.reset();
        setKind("flight");
        setColor("");
        document.getElementById("sheetTitle").textContent = "Add booking";
        document.getElementById("saveBooking").textContent = "Add to itinerary";
        document.getElementById("removeBooking").hidden = true;
        showApp();
        render(payload.items || []);
        toast("Removed");
      } catch (error) {
        if (error.locked) showGate("Open it again.");
        else err.textContent = error.message;
      }
    });

    addForm.addEventListener("submit", async event => {
      event.preventDefault();
      const err = document.getElementById("addErr");
      err.textContent = "";
      const data = Object.fromEntries(new FormData(addForm).entries());
      data.kind = kind;
      const editing = editingId;
      if (editing) data.id = editing;
      try {
        const payload = await api(editing ? "/trip/api/items/update" : "/trip/api/items", {method: "POST", body: JSON.stringify(data)});
        editingId = "";
        addForm.reset();
        setKind("flight");
        setColor("");
        document.getElementById("sheetTitle").textContent = "Add booking";
        document.getElementById("saveBooking").textContent = "Add to itinerary";
        document.getElementById("removeBooking").hidden = true;
        showApp();
        render(payload.items || []);
        toast(editing ? "Saved" : "Added");
      } catch (error) {
        if (error.locked) showGate("Open it again.");
        else err.textContent = error.message;
      }
    });

    api("/trip/api").then(payload => {
      showApp();
      if (payload.rates) rates = payload.rates;
      renderInsurance(payload.insurance);
      render(payload.items || []);
      renderTodos(payload.todos);
      refreshDeploy().catch(() => {});
    }).catch(() => showGate(""));
  </script>
</body>
</html>
